[package]
name = "openmanuals"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Pablo Soage <p.soage@udc.es>"]
license = "MIT"
description = "Workshop manuals by VIN or model, served to a phone or a PC"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
flate2 = "1"
percent-encoding = "2"

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
