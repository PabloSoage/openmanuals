<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>openmanuals</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button id="back" class="icon" aria-label="Atrás" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <a href="#/" class="brand">open<b>manuals</b></a>
  <div id="title" class="title"></div>
  <select id="lang" aria-label="Idioma">
    <option value="es">ES</option><option value="en">EN</option>
    <option value="de">DE</option><option value="pt">PT</option>
  </select>
</header>
<main id="view"></main>
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <button class="icon" data-act="out" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="icon" data-act="fit" aria-label="Ajustar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="icon" data-act="in" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <a class="icon" data-act="open" target="_blank" aria-label="Abrir aparte"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></a>
    <button class="icon" data-act="close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="viewer-stage"><img alt=""></div>
</div>
</body>
</html>
